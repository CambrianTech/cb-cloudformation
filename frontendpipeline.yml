Description: Frontend deployment pipeline with approval process
Parameters:
  CodePipelineBucket:
    Default: codepipeline-us-east-1-403239856615
    Description: S3 Bucket used by codepipeline. Needs to have block all public access
      off.
    Type: String
  ECRRepoName:
    Default: 312943975091.dkr.ecr.us-east-1.amazonaws.com/cb-shaw-frontend-dev
    Description: The full ECR repository URI to push the frontend image to.
    Type: String
  ElasticBeanstalkProductionApp:
    Default: shaw-frontend-dev
    Description: Elastic Beanstalk production application.
    Type: String
  ElasticBeanstalkProductionEnv:
    Default: shaw-frontend-dev-main
    Description: Elastic Beanstalk production environment.
    Type: String
  ElasticBeanstalkStagingApp:
    Default: shaw-frontend-dev
    Description: Elastic Beanstalk staging application.
    Type: String
  ElasticBeanstalkStagingEnv:
    Default: shaw-frontend-dev-staging
    Description: Elastic Beanstalk staging environment.
    Type: String
  ElasticBeanstalkStagingUrl:
    Default: https://dev-staging.cambrianar.com
    Description: Url that is shown in the notification for the deployment approval
      process. Should be the url that points to the staging website.
    Type: String
  EnvFileBucket:
    Default: cb-codebuild-env-files
    Description: S3 bucket where zipped env files are stored. Needs to have versioning
      enabled.
    Type: String
  EnvFilePath:
    Default: dev.zip
    Description: Path within the env file S3 bucket to the zipped env files.
    Type: String
  GitHubBranch:
    Default: feature/ebenv
    Description: Branch of the GitHub repository.
    Type: String
  GitHubOAuthToken:
    Default: 25e6bd223c762f0dcdc54c698a2436bb50bcab49
    Description: OAuth Token for accessing the GitHub repository. See https://docs.aws.amazon.com/codebuild/latest/userguide/sample-access-tokens.html
      for more information.
    Type: String
  GitHubOwner:
    Default: CambrianTech
    Description: Owning organization or user of the GitHub repository.
    Type: String
  GitHubRepo:
    Default: shaw-frontend
    Description: Name of the GitHub repository.
    Type: String
Resources:
  ApproveFrontendDeployment:
    Properties:
      TopicName: ApproveFrontendDeployment
    Type: AWS::SNS::Topic
  CodebuildRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
        Version: '2012-10-17'
      Path: /service-role/
      Policies:
        - PolicyDocument:
            Statement:
              - Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Effect: Allow
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Effect: Allow
                Resource:
                  - !Sub 'arn:aws:s3:::codepipeline-${AWS::Region}-*'
              - Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                Effect: Allow
                Resource:
                  - !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*'
              - Action: ecr:GetAuthorizationToken
                Effect: Allow
                Resource: '*'
              - Action: ecr:*
                Effect: Allow
                Resource: !Sub
                  - arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepoName}
                  - RepoName: !Ref 'ECRRepoName'
            Version: '2012-10-17'
          PolicyName: !Sub
            - codebuild-Frontend-Build-${Id}-service-role
            - Id: 35193784
      RoleName: !Sub
        - codebuild-Frontend-Build-${Id}-service-role
        - Id: 35193784
    Type: AWS::IAM::Role
  Frontend:
    Properties:
      ArtifactStore:
        Location: !Ref 'CodePipelineBucket'
        Type: S3
      Name: !Sub
        - Frontend-${Id}
        - Id: 35193784
      RoleArn: !GetAtt 'PipelineRole.Arn'
      Stages:
        - Actions:
            - ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              Configuration:
                Branch: !Ref 'GitHubBranch'
                OAuthToken: !Ref 'GitHubOAuthToken'
                Owner: !Ref 'GitHubOwner'
                PollForSourceChanges: 'false'
                Repo: !Ref 'GitHubRepo'
              InputArtifacts: []
              Name: Source
              OutputArtifacts:
                - Name: SourceArtifact
              Region: !Ref 'AWS::Region'
              RunOrder: 1
            - ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                PollForSourceChanges: 'false'
                S3Bucket: !Ref 'EnvFileBucket'
                S3ObjectKey: !Ref 'EnvFilePath'
              InputArtifacts: []
              Name: EnvFiles
              OutputArtifacts:
                - Name: EnvFiles
              Region: !Ref 'AWS::Region'
              RunOrder: 1
          Name: Source
        - Actions:
            - ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                EnvironmentVariables: !Sub
                  - '[{"name":"ECR_REPOSITORY_URI","value":"${ImageRepoName}","type":"PLAINTEXT"}]'
                  - ImageRepoName: !Ref 'ECRRepoName'
                PrimarySource: SourceArtifact
                ProjectName: !Sub
                  - Frontend-Build-${Id}
                  - Id: 35193784
              InputArtifacts:
                - Name: SourceArtifact
                - Name: EnvFiles
              Name: Build
              OutputArtifacts:
                - Name: BeanstalkDockerrun
              Region: !Ref 'AWS::Region'
              RunOrder: 1
          Name: Build
        - Actions:
            - ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ElasticBeanstalk
                Version: '1'
              Configuration:
                ApplicationName: !Ref 'ElasticBeanstalkStagingApp'
                EnvironmentName: !Ref 'ElasticBeanstalkStagingEnv'
              InputArtifacts:
                - Name: BeanstalkDockerrun
              Name: DeployStaging
              OutputArtifacts: []
              Region: !Ref 'AWS::Region'
              RunOrder: 1
            - ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                ExternalEntityLink: !Ref 'ElasticBeanstalkStagingUrl'
                NotificationArn: !Ref 'ApproveFrontendDeployment'
              InputArtifacts: []
              Name: Approve
              OutputArtifacts: []
              Region: !Ref 'AWS::Region'
              RunOrder: 2
          Name: Approve
        - Actions:
            - ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ElasticBeanstalk
                Version: '1'
              Configuration:
                ApplicationName: !Ref 'ElasticBeanstalkProductionApp'
                EnvironmentName: !Ref 'ElasticBeanstalkProductionEnv'
              InputArtifacts:
                - Name: BeanstalkDockerrun
              Name: Deploy
              OutputArtifacts: []
              Region: !Ref 'AWS::Region'
              RunOrder: 1
          Name: Deploy
    Type: AWS::CodePipeline::Pipeline
  FrontendBuild:
    Properties:
      Artifacts:
        EncryptionDisabled: 'false'
        Packaging: NONE
        Type: CODEPIPELINE
      BadgeEnabled: 'false'
      Cache:
        Type: NO_CACHE
      EncryptionKey: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/s3'
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables: []
        Image: aws/codebuild/standard:3.0
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: 'true'
        Type: LINUX_CONTAINER
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
        S3Logs:
          EncryptionDisabled: 'false'
          Status: DISABLED
      Name: !Sub
        - Frontend-Build-${Id}
        - Id: 35193784
      SecondarySourceVersions: []
      ServiceRole: !GetAtt 'CodebuildRole.Arn'
      Source:
        InsecureSsl: 'false'
        Type: CODEPIPELINE
      TimeoutInMinutes: 60
    Type: AWS::CodeBuild::Project
  PipelineRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
        Version: '2012-10-17'
      Path: /service-role/
      Policies:
        - PolicyDocument:
            Statement:
              - Action:
                  - iam:PassRole
                Condition:
                  StringEqualsIfExists:
                    iam:PassedToService:
                      - cloudformation.amazonaws.com
                      - elasticbeanstalk.amazonaws.com
                      - ec2.amazonaws.com
                      - ecs-tasks.amazonaws.com
                Effect: Allow
                Resource: '*'
              - Action:
                  - codecommit:CancelUploadArchive
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:UploadArchive
                Effect: Allow
                Resource: '*'
              - Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:RegisterApplicationRevision
                Effect: Allow
                Resource: '*'
              - Action:
                  - elasticbeanstalk:*
                  - ec2:*
                  - elasticloadbalancing:*
                  - autoscaling:*
                  - cloudwatch:*
                  - s3:*
                  - sns:*
                  - cloudformation:*
                  - rds:*
                  - sqs:*
                  - ecs:*
                Effect: Allow
                Resource: '*'
              - Action:
                  - lambda:InvokeFunction
                  - lambda:ListFunctions
                Effect: Allow
                Resource: '*'
              - Action:
                  - opsworks:CreateDeployment
                  - opsworks:DescribeApps
                  - opsworks:DescribeCommands
                  - opsworks:DescribeDeployments
                  - opsworks:DescribeInstances
                  - opsworks:DescribeStacks
                  - opsworks:UpdateApp
                  - opsworks:UpdateStack
                Effect: Allow
                Resource: '*'
              - Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                Effect: Allow
                Resource: '*'
              - Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Effect: Allow
                Resource: '*'
              - Action:
                  - devicefarm:ListProjects
                  - devicefarm:ListDevicePools
                  - devicefarm:GetRun
                  - devicefarm:GetUpload
                  - devicefarm:CreateUpload
                  - devicefarm:ScheduleRun
                Effect: Allow
                Resource: '*'
              - Action:
                  - servicecatalog:ListProvisioningArtifacts
                  - servicecatalog:CreateProvisioningArtifact
                  - servicecatalog:DescribeProvisioningArtifact
                  - servicecatalog:DeleteProvisioningArtifact
                  - servicecatalog:UpdateProduct
                Effect: Allow
                Resource: '*'
              - Action:
                  - cloudformation:ValidateTemplate
                Effect: Allow
                Resource: '*'
              - Action:
                  - ecr:DescribeImages
                Effect: Allow
                Resource: '*'
            Version: '2012-10-17'
          PolicyName: !Sub
            - AWSCodePipelineServiceRole-${AWS::Region}-Frontend-${Id}
            - Id: 35193784
      RoleName: !Sub
        - AWSCodePipelineServiceRole-${AWS::Region}-Frontend-${Id}
        - Id: 35193784
    Type: AWS::IAM::Role
